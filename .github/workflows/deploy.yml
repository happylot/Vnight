name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  APP_DOMAIN: aspac2026.jci.vn
  DEPLOY_PATH: /var/www/aspac2026.jci.vn
  STAGING_PATH: /tmp/aspac2026-release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/aspac2026_deploy_key"
          chmod 600 "$HOME/.ssh/aspac2026_deploy_key"

      - name: Prepare staging directory on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/aspac2026_deploy_key" \
            -o StrictHostKeyChecking=no \
            -p "$VPS_PORT" \
            "$VPS_USERNAME@$VPS_HOST" \
            "set -eu; mkdir -p '$DEPLOY_PATH' '$STAGING_PATH'; rm -rf '$STAGING_PATH'/*; if ! command -v rsync >/dev/null 2>&1; then apt-get update && apt-get install -y rsync; fi"

      - name: Upload site files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -eu
          scp -i "$HOME/.ssh/aspac2026_deploy_key" \
            -o StrictHostKeyChecking=no \
            -P "$VPS_PORT" \
            -r api assets css js keyvisual.jpg qr.jpg index.html showcase.html \
            "$VPS_USERNAME@$VPS_HOST:$STAGING_PATH/"

      - name: Sync release and configure nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/aspac2026_deploy_key" \
            -o StrictHostKeyChecking=no \
            -p "$VPS_PORT" \
            "$VPS_USERNAME@$VPS_HOST" <<'EOF'
          set -eu

          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y nginx
          fi

          rsync -av --delete "/tmp/aspac2026-release/" "/var/www/aspac2026.jci.vn/"
          chown -R www-data:www-data "/var/www/aspac2026.jci.vn"
          find "/var/www/aspac2026.jci.vn" -type d -exec chmod 755 {} \;
          find "/var/www/aspac2026.jci.vn" -type f -exec chmod 644 {} \;

          if [ -f /etc/letsencrypt/live/aspac2026.jci.vn/fullchain.pem ]; then
            cat <<'NGINX_SSL' >/etc/nginx/sites-available/aspac2026.jci.vn
          server {
              server_name aspac2026.jci.vn;

              root /var/www/aspac2026.jci.vn;
              index index.html;

              access_log /var/log/nginx/aspac2026.jci.vn.access.log;
              error_log /var/log/nginx/aspac2026.jci.vn.error.log;

              location / {
                  try_files $uri $uri/ =404;
              }

              location = /api/lead.php {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME /var/www/aspac2026.jci.vn/api/lead.php;
              }

              location ~ \.php$ {
                  return 404;
              }

              location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico)$ {
                  expires 7d;
                  add_header Cache-Control "public, max-age=604800, immutable";
                  try_files $uri =404;
              }

              listen 443 ssl;
              listen [::]:443 ssl;
              ssl_certificate /etc/letsencrypt/live/aspac2026.jci.vn/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/aspac2026.jci.vn/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
          }

          server {
              listen 80;
              listen [::]:80;
              server_name aspac2026.jci.vn;

              location = /api/lead.php {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME /var/www/aspac2026.jci.vn/api/lead.php;
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }
          NGINX_SSL
          else
            cat <<'NGINX_HTTP' >/etc/nginx/sites-available/aspac2026.jci.vn
          server {
              listen 80;
              listen [::]:80;
              server_name aspac2026.jci.vn;

              root /var/www/aspac2026.jci.vn;
              index index.html;

              access_log /var/log/nginx/aspac2026.jci.vn.access.log;
              error_log /var/log/nginx/aspac2026.jci.vn.error.log;

              location / {
                  try_files $uri $uri/ =404;
              }

              location = /api/lead.php {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME /var/www/aspac2026.jci.vn/api/lead.php;
              }

              location ~ \.php$ {
                  return 404;
              }

              location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico)$ {
                  expires 7d;
                  add_header Cache-Control "public, max-age=604800, immutable";
                  try_files $uri =404;
              }
          }
          NGINX_HTTP
          fi

          ln -sfn /etc/nginx/sites-available/aspac2026.jci.vn /etc/nginx/sites-enabled/aspac2026.jci.vn
          nginx -t
          systemctl reload nginx
          EOF
